[workspace]
resolver = "3"
members = [
    "crates/clientmail-domain",
    "crates/clientmail-store",
    "crates/clientmail-engine",
    "crates/clientmail-ffi",
    "tools/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
clientmail-domain = { path = "crates/clientmail-domain" }
clientmail-engine = { path = "crates/clientmail-engine" }
clientmail-store = { path = "crates/clientmail-store" }
email_address = "0.2.9"
rusqlite = { version = "0.41.0", features = ["bundled"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
uniffi = "0.32.2"
uuid = { version = "1.29.0", features = ["v7"] }

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"
let_underscore_drop = "warn"

[workspace.lints.clippy]
# Broad groups. Priority -1 lets the specific lints below override them.
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Selected restriction lints.
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "deny"
expect_used = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
indexing_slicing = "warn"
missing_assert_message = "warn"
panic = "warn"
print_stderr = "deny"
print_stdout = "deny"
rc_buffer = "warn"
redundant_type_annotations = "warn"
implicit_clone = "warn"
str_to_string = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "warn"

# Noise for an application workspace that is never published.
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
# Contradicts rustc's `unreachable_pub`, which this workspace keeps.
redundant_pub_crate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
