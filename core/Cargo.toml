[workspace]
resolver = "3"
members = [
    "crates/clientmail-domain",
    "crates/clientmail-store",
    "crates/clientmail-engine",
    "crates/clientmail-oauth",
    "crates/clientmail-imap",
    "crates/clientmail-mime",
    "crates/clientmail-ffi",
    "tools/uniffi-bindgen",
]
# Patched third-party crates (vendor/VENDOR.md): not ours to lint, format or test.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
clientmail-domain = { path = "crates/clientmail-domain" }
clientmail-engine = { path = "crates/clientmail-engine" }
clientmail-mime = { path = "crates/clientmail-mime" }
clientmail-oauth = { path = "crates/clientmail-oauth" }
clientmail-store = { path = "crates/clientmail-store" }
base64 = "0.23.1"
# Dates for IMAP `SEARCH` and `INTERNALDATE`; already in the build through `imap-types`.
chrono = { version = "0.4.45", default-features = false }
email_address = "0.2.9"
getrandom = "0.4.3"
# Pinned: patched copies under vendor/ (VENDOR.md). Change only together with the copies.
imap-codec = "=2.0.0-alpha.9"
imap-types = "=2.0.0-alpha.7"
imap-next = { version = "0.3.4", default-features = false, features = ["ext_condstore_qresync"] }
# imap-codec 2.0.0-alpha.9 (through imap-next) uses nom's `alloc` without asking for it.
# `full_encoding` decodes legacy charsets beyond UTF-8 and Latin-1 (Shift_JIS, GBK, KOI8-R...).
mail-parser = { version = "1.0.0", default-features = false, features = ["full_encoding"] }
nom = { version = "7.1.3", default-features = false, features = ["alloc"] }
pollster = "1.0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "form", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
uniffi = "0.32.2"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v7"] }

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"
let_underscore_drop = "warn"

[workspace.lints.clippy]
# Broad groups. Priority -1 lets the specific lints below override them.
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Selected restriction lints.
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "deny"
expect_used = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
indexing_slicing = "warn"
missing_assert_message = "warn"
panic = "warn"
print_stderr = "deny"
print_stdout = "deny"
rc_buffer = "warn"
redundant_type_annotations = "warn"
implicit_clone = "warn"
str_to_string = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "warn"

# Noise for an application workspace that is never published.
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
# Contradicts rustc's `unreachable_pub`, which this workspace keeps.
redundant_pub_crate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

# Gmail's fetch items, not yet upstream (vendor/VENDOR.md, decision record 0012).
[patch.crates-io]
imap-codec = { path = "vendor/imap-codec" }
imap-types = { path = "vendor/imap-types" }
